name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build application
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -timeout=5m ./...

  processor:
    name: Processor Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: processor

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install flask werkzeug pytest

      - name: Run tests
        run: python -m pytest test_app.py -v

  docker:
    name: Docker Compose Validation & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate docker-compose configuration
        run: |
          docker compose config --quiet
          docker compose build --print > "$RUNNER_TEMP/compose-bake.json"

      - name: Build all containers
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: ${{ runner.temp }}/compose-bake.json
          load: true
          pull: true
          set: |
            backend.cache-from=type=gha,version=2,scope=ci-backend-${{ runner.os }}-${{ runner.arch }}
            backend.cache-to=type=gha,version=2,scope=ci-backend-${{ runner.os }}-${{ runner.arch }},mode=max
            frontend.cache-from=type=gha,version=2,scope=ci-frontend-${{ runner.os }}-${{ runner.arch }}
            frontend.cache-to=type=gha,version=2,scope=ci-frontend-${{ runner.os }}-${{ runner.arch }},mode=max
            processor.cache-from=type=gha,version=2,scope=ci-processor-${{ runner.os }}-${{ runner.arch }}
            processor.cache-to=type=gha,version=2,scope=ci-processor-${{ runner.os }}-${{ runner.arch }},mode=max
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Start containers and wait for healthy status
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Verify container health
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down -v
